# Linked to ~/.config/containers/containers.conf.d/ by agentbox-prep.sh.
# Registers gVisor. The default runtime stays crun, so your other podman use
# is unchanged; agentbox scripts always pass --runtime runsc explicitly.
[engine.runtimes]
runsc = ["/usr/local/bin/runsc"]

[engine.runtime_flags]
runsc = ["ignore-cgroups", "network=host"]
